name: Save compatibility checks
on:
  push:
    branches: [p0/protect-progress, family-playtest-v2]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test && npm run check
      - run: npm run build:native
      - run: npx esbuild supabase/functions/leaderboard/index.ts --format=esm --platform=neutral --outfile=/tmp/leaderboard-edge-check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser-saves.py
      - run: python tests/browser-prototype.py
      - run: python backend/tests/run-postgres.py "$LEADERBOARD_TEST_CONTAINER"
        env:
          LEADERBOARD_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: python backend/tests/browser-shared.py
        env:
          LEADERBOARD_TEST_CONTAINER: ${{ job.services.postgres.id }}
